name: ci
on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: requirements-dev.txt
      - name: Install
        run: pip install -r requirements.txt pytest==9.2.0 httpx==0.28.1 cfn-lint
      - name: Unit + smoke tests (smoke tests use the committed model artifacts)
        run: python -m pytest -q
      - name: Lint CloudFormation templates
        run: cfn-lint deploy/*.yaml
      - name: Rebuild splits from the raw CSV (guards the fresh-clone path)
        run: python make_splits.py
