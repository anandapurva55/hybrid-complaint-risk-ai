name: ci
on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: |
            requirements.txt
            pyproject.toml
      - name: Install
        run: |
          pip install --extra-index-url https://download.pytorch.org/whl/cpu -e ".[test]"
      - name: Unit + smoke tests (smoke tests use the committed model artifacts)
        run: python -m pytest -q
      - name: Lint CloudFormation templates
        run: cfn-lint deploy/*.yaml
      - name: Rebuild splits from the raw CSV (guards the fresh-clone path)
        run: python -m training.make_splits
