AWSTemplateFormatVersion: "2010-09-09"
Description: >
  One-time setup so GitHub Actions can deploy ecs-fargate.yaml with short-lived OIDC credentials
  (no access keys stored anywhere, no root user). Deploy this ONCE from your own admin identity.

Parameters:
  GitHubRepo:
    Type: String
    Default: anandapurva55/hybrid-complaint-risk-ai
    Description: owner/name allowed to assume the role
  GitHubEnvironment:
    Type: String
    Default: production
    Description: Only workflow runs in this GitHub Environment may assume the role (add required reviewers there)
  CreateOidcProvider:
    Type: String
    AllowedValues: ["true", "false"]
    Default: "true"
    Description: Set to false if the account already has the token.actions.githubusercontent.com provider
  ExistingOidcProviderArn:
    Type: String
    Default: ""

Conditions:
  MakeProvider: !Equals [!Ref CreateOidcProvider, "true"]

Resources:
  GitHubProvider:
    Type: AWS::IAM::OIDCProvider
    Condition: MakeProvider
    Properties:
      Url: https://token.actions.githubusercontent.com
      ClientIdList: [sts.amazonaws.com]

  DeployRole:
    Type: AWS::IAM::Role
    Properties:
      RoleName: hybrid-risk-github-deploy
      MaxSessionDuration: 3600
      AssumeRolePolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Effect: Allow
            Principal:
              Federated: !If [MakeProvider, !Ref GitHubProvider, !Ref ExistingOidcProviderArn]
            Action: sts:AssumeRoleWithWebIdentity
            Condition:
              StringEquals:
                token.actions.githubusercontent.com:aud: sts.amazonaws.com
                token.actions.githubusercontent.com:sub: !Sub repo:${GitHubRepo}:environment:${GitHubEnvironment}
      Policies:
        - PolicyName: deploy-hybrid-risk-stack
          PolicyDocument:
            Version: "2012-10-17"
            Statement:
              - Sid: Stack
                Effect: Allow
                Action: cloudformation:*
                Resource: !Sub arn:${AWS::Partition}:cloudformation:${AWS::Region}:${AWS::AccountId}:stack/hybrid-risk-api/*
              - Sid: StackReads
                Effect: Allow
                Action: [cloudformation:ValidateTemplate, cloudformation:GetTemplateSummary, cloudformation:ListStacks]
                Resource: "*"
              - Sid: Image
                Effect: Allow
                Action:
                  - ecr:GetAuthorizationToken
                Resource: "*"
              - Sid: ImageRepo
                Effect: Allow
                Action: [ecr:BatchCheckLayerAvailability, ecr:InitiateLayerUpload, ecr:UploadLayerPart, ecr:CompleteLayerUpload, ecr:PutImage, ecr:BatchGetImage, ecr:DescribeImages, ecr:CreateRepository, ecr:DescribeRepositories]
                Resource: !Sub arn:${AWS::Partition}:ecr:${AWS::Region}:${AWS::AccountId}:repository/hybrid-risk-api
              - Sid: ResourcesTheStackManages
                Effect: Allow
                Action:
                  - ecs:*
                  - elasticloadbalancing:*
                  - ec2:Describe*
                  - ec2:CreateSecurityGroup
                  - ec2:DeleteSecurityGroup
                  - ec2:AuthorizeSecurityGroupIngress
                  - ec2:RevokeSecurityGroupIngress
                  - ec2:CreateTags
                  - logs:*
                  - secretsmanager:*
                  - sns:*
                  - cloudwatch:*
                  - application-autoscaling:*
                  - wafv2:*
                  - cloudfront:*
                  - bedrock:GetInferenceProfile
                Resource: "*"
              - Sid: StackRoles
                Effect: Allow
                Action: [iam:CreateRole, iam:DeleteRole, iam:GetRole, iam:PutRolePolicy, iam:DeleteRolePolicy, iam:GetRolePolicy, iam:AttachRolePolicy, iam:DetachRolePolicy, iam:TagRole, iam:UpdateAssumeRolePolicy]
                Resource: !Sub arn:${AWS::Partition}:iam::${AWS::AccountId}:role/hybrid-risk-api-*
              - Sid: PassOnlyStackRolesToEcs
                Effect: Allow
                Action: iam:PassRole
                Resource: !Sub arn:${AWS::Partition}:iam::${AWS::AccountId}:role/hybrid-risk-api-*
                Condition:
                  StringEquals: { "iam:PassedToService": ecs-tasks.amazonaws.com }
              - Sid: AutoscalingServiceLinkedRole
                Effect: Allow
                Action: iam:CreateServiceLinkedRole
                Resource: "*"
                Condition:
                  StringLike: { "iam:AWSServiceName": [ecs.application-autoscaling.amazonaws.com, ecs.amazonaws.com, elasticloadbalancing.amazonaws.com] }

Outputs:
  DeployRoleArn:
    Description: Save as the GitHub repository variable AWS_DEPLOY_ROLE_ARN
    Value: !GetAtt DeployRole.Arn
