[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "hybrid-risk"
version = "3.0.0"
description = "Hybrid customer-dissatisfaction risk triage: classical ML + fine-tuned DistilBERT, a calibrated decision layer and LLM explanations"
requires-python = ">=3.11"
# Runtime dependencies are pinned in requirements.txt; install them first.

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src", "."]
testpaths = ["tests"]
